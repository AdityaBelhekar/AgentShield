[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield-x"
dynamic = ["version"]
description = "A policy-enforcing reference monitor for AI agent tool calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aditya Belhekar", email = "adityabelhekar@gmail.com" }]

keywords = [
  "ai-agents", "llm-security", "prompt-injection", "agent-security",
  "information-flow-control", "mcp", "runtime-security"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# Core stays light: anything else belongs in an extra.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
langchain = [
  "langchain>=1.0",
  "langgraph>=1.0",
]
audit = [
  "cryptography>=42",
]
classifier = [
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface-hub>=0.20",
  "numpy>=1.24",
]
otel = [
  "opentelemetry-api>=1.20",
]
bench = [
  "agentdojo>=0.1.35,<0.2",
]
dev = [
  "mcp>=2.3",
  "opentelemetry-sdk>=1.20",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
agentshield = "agentshield.cli:main"

[project.urls]
Homepage = "https://github.com/AdityaBelhekar/AgentShield"
Documentation = "https://AdityaBelhekar.github.io/AgentShield"
Repository = "https://github.com/AdityaBelhekar/AgentShield"
"Bug Tracker" = "https://github.com/AdityaBelhekar/AgentShield/issues"
Changelog = "https://github.com/AdityaBelhekar/AgentShield/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "agentshield/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentshield"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agentdojo.*", "openai.*", "onnxruntime.*", "tokenizers.*", "numpy.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
