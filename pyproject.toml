[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield-x"
dynamic = ["version"]
description = "A policy-enforcing reference monitor for AI agent tool calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aditya Belhekar", email = "adityabelhekar@gmail.com" }]

keywords = [
  "ai-agents", "llm-security", "prompt-injection", "agent-security",
  "information-flow-control", "mcp", "runtime-security"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# Core stays light: anything else belongs in an extra.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/AdityaBelhekar/AgentShield"
Documentation = "https://AdityaBelhekar.github.io/AgentShield"
Repository = "https://github.com/AdityaBelhekar/AgentShield"
"Bug Tracker" = "https://github.com/AdityaBelhekar/AgentShield/issues"
Changelog = "https://github.com/AdityaBelhekar/AgentShield/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "agentshield/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentshield"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
