<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="An injected page and a secret file reach the model; AgentShield answers ask on the outbound send_email call, so it never runs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b2f"/>
    </linearGradient>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a93a8"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#f2f4fa" font-size="26" font-weight="700">The lethal trifecta, stopped at the tool boundary</text>
    <text x="48" y="90" fill="#8a93a8" font-size="18">Untrusted input + confidential data + an outbound tool = an exfiltration path. The session's taint closes it.</text>
  </g>

  <!-- sources -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="18">
    <rect x="48" y="140" width="250" height="96" rx="14" fill="#18213a" stroke="#7aa7ff" stroke-opacity="0.55"/>
    <text x="70" y="178" fill="#e6e9f2">web_fetch()</text>
    <text x="70" y="210" fill="#ffc979" font-size="15">untrusted · injected page</text>

    <rect x="48" y="290" width="250" height="96" rx="14" fill="#18213a" stroke="#7aa7ff" stroke-opacity="0.55"/>
    <text x="70" y="328" fill="#e6e9f2">read_file()</text>
    <text x="70" y="360" fill="#7aa7ff" font-size="15">confidential · db password</text>
  </g>

  <!-- model -->
  <rect x="408" y="200" width="190" height="126" rx="16" fill="#1c2540" stroke="#8a93a8" stroke-opacity="0.6"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="503" y="256" fill="#f2f4fa" font-size="24" font-weight="600">model</text>
    <text x="503" y="286" fill="#8a93a8" font-size="15">obeys the page</text>
  </g>

  <path d="M298 188 C350 188 360 235 404 240" fill="none" stroke="#7aa7ff" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a-blue)"/>
  <path d="M298 338 C350 338 360 292 404 286" fill="none" stroke="#7aa7ff" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a-blue)"/>

  <!-- gate -->
  <g transform="translate(700 168)">
    <path d="M60 0 L118 20 V66 C118 104 92 132 60 146 C28 132 2 104 2 66 V20 Z" fill="#4f6fe0"/>
    <path d="M36 72 L54 90 L88 54" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="760" y="346" fill="#f2f4fa" font-size="19" font-weight="600">AgentShield</text>
    <text x="760" y="372" fill="#8a93a8" font-size="15">taint: untrusted + confidential</text>
  </g>
  <path d="M598 263 L692 247" fill="none" stroke="#8a93a8" stroke-width="3" marker-end="url(#a-grey)"/>

  <!-- sink -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="18">
    <rect x="982" y="196" width="250" height="96" rx="14" fill="#2a1820" stroke="#ff6b6b" stroke-opacity="0.8"/>
    <text x="1004" y="234" fill="#e6e9f2">send_email()</text>
    <text x="1004" y="266" fill="#ff9d9d" font-size="15">external · never runs</text>
  </g>
  <path d="M828 244 L976 244" fill="none" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a-red)"/>
  <g transform="translate(902 244)">
    <circle r="17" fill="#2a1820" stroke="#ff6b6b" stroke-width="2.5"/>
    <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="902" y="210" fill="#ff9d9d" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" text-anchor="middle">ask → blocked</text>
</svg>
