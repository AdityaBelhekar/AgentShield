site_name: AgentShield
site_description: "A policy-enforcing reference monitor for AI agent tool calls."
site_url: https://AdityaBelhekar.github.io/AgentShield
repo_url: https://github.com/AdityaBelhekar/AgentShield
repo_name: AdityaBelhekar/AgentShield
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - How It Decides: getting-started/how-it-works.md
  - Guide:
      - Policies: guide/policies.md
      - LangChain / LangGraph: guide/langchain.md
      - MCP Gateway: guide/mcp-gateway.md
      - Audit Log and Flow Graph: guide/audit-log.md
      - Detectors: guide/detectors.md
      - OpenTelemetry: guide/opentelemetry.md
  - Threat Model: threat-model.md
  - Benchmark: benchmark.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/api.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AdityaBelhekar/AgentShield
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentshield-x/